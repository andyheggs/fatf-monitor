name: FATF monitor

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test API
        run: dotnet test FatfMonitor.slnx --configuration Release

      - name: Run FATF check from GitHub runner
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5088
          ASPNETCORE_ENVIRONMENT: Production
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          home_url="https://www.fatf-gafi.org/"

          : > fatf-source-preflight.txt
          for source_url in "$home_url"; do
            status=$(curl --silent --show-error \
              --location \
              --user-agent "Mozilla/5.0 (compatible; FatfMonitor/1.0; +https://github.com/andyheggs/fatf-monitor)" \
              --write-out "%{http_code}" \
              --output /dev/null \
              "$source_url" || true)
            echo "$status $source_url" >> fatf-source-preflight.txt
          done

          dotnet run \
            --project src/FatfMonitor.Api/FatfMonitor.Api.csproj \
            --configuration Release \
            --no-restore > api.log 2>&1 &

          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:5088/api/session >/dev/null; then
              break
            fi

            if [ "$attempt" -eq 45 ]; then
              echo "API did not become ready."
              tail -100 api.log
              exit 1
            fi

            sleep 1
          done

          curl_exit=0
          http_status=$(curl --silent --show-error \
            --write-out "%{http_code}" \
            http://127.0.0.1:5088/api/compliance/fatf/jurisdictions \
            --output fatf-result.json || curl_exit=$?)

          python - "$http_status" "$curl_exit" <<'PY'
          import json
          import sys
          from datetime import date
          from pathlib import Path

          http_status = sys.argv[1]
          curl_exit = sys.argv[2]
          result_path = Path("fatf-result.json")
          result_text = result_path.read_text(encoding="utf-8", errors="replace") if result_path.exists() else ""
          preflight = Path("fatf-source-preflight.txt").read_text(encoding="utf-8", errors="replace")
          api_log = Path("api.log").read_text(encoding="utf-8", errors="replace") if Path("api.log").exists() else ""

          summary = [
              "## FATF monitor result",
              "",
              f"- API HTTP status: {http_status}",
              f"- Curl exit code: {curl_exit}",
              "",
              "### FATF source preflight",
              "",
              "```text",
              preflight.strip(),
              "```",
          ]

          try:
              result = json.loads(result_text)
          except json.JSONDecodeError:
              result = None

          if isinstance(result, dict) and http_status == "200":
              increased_list = result.get("increasedMonitoring") or {}
              call_for_action_list = result.get("callForAction") or {}
              increased = increased_list.get("jurisdictions") or []
              call_for_action = call_for_action_list.get("jurisdictions") or []
              review = result.get("llmReview") or {}

              today = date.today()
              if (today.month > 10 or (today.month == 10 and today.day >= 28)):
                  minimum_date = date(today.year, 10, 1)
              elif (today.month > 6 or (today.month == 6 and today.day >= 28)):
                  minimum_date = date(today.year, 6, 1)
              elif (today.month > 2 or (today.month == 2 and today.day >= 28)):
                  minimum_date = date(today.year, 2, 1)
              else:
                  minimum_date = date(today.year - 1, 10, 1)

              increased_date = date.fromisoformat(increased_list.get("publicationDate", ""))
              call_for_action_date = date.fromisoformat(call_for_action_list.get("publicationDate", ""))
              if increased_date != call_for_action_date:
                  raise SystemExit("FATF publication dates do not match.")
              if increased_date < minimum_date:
                  raise SystemExit(
                      f"Stale FATF publication {increased_date}; expected {minimum_date} or later."
                  )
              if increased_date > today:
                  raise SystemExit(f"FATF publication date {increased_date} is in the future.")

              summary.extend([
                  "",
                  "### Extracted lists",
                  "",
                  f"- Publication date: {increased_date}",
                  f"- Increased monitoring jurisdictions: {len(increased)}",
                  f"- Call for action jurisdictions: {len(call_for_action)}",
                  f"- Total jurisdictions: {result.get('totalJurisdictions')}",
                  f"- LLM review enabled: {review.get('enabled')}",
                  f"- LLM model: {review.get('model')}",
              ])
          else:
              summary.extend([
                  "",
                  "### Response body",
                  "",
                  "```text",
                  result_text[-4000:],
                  "```",
                  "",
                  "### API log tail",
                  "",
                  "```text",
                  api_log[-4000:],
                  "```",
              ])

          Path("fatf-summary.md").write_text("\n".join(summary), encoding="utf-8")
          print("\n".join(summary))
          PY

          cat fatf-summary.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$curl_exit" != "0" ] || [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
            exit 1
          fi

      - name: Build GitHub Pages output
        run: |
          set -euo pipefail

          mkdir -p pages
          cp fatf-result.json pages/fatf-result.json
          cp fatf-summary.md pages/fatf-summary.md

          python <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          result = json.loads(Path("fatf-result.json").read_text(encoding="utf-8"))
          generated_at = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          checked_at = result.get("checkedAt", generated_at)
          dated_name = f"fatf-result-{generated_at[:10]}.json"

          Path("pages/latest.json").write_text(
              json.dumps(result, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )
          Path("pages", dated_name).write_text(
              json.dumps(result, ensure_ascii=True, indent=2) + "\n",
              encoding="utf-8",
          )

          increased = result.get("increasedMonitoring") or {}
          call_for_action = result.get("callForAction") or {}
          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>FATF Monitor</title>
            <style>
              body {{ font-family: Arial, sans-serif; max-width: 920px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }}
              code {{ background: #f2f4f7; padding: 2px 5px; border-radius: 4px; }}
              a {{ color: #0645ad; }}
            </style>
          </head>
          <body>
            <h1>FATF Monitor</h1>
            <p>Latest generated result from the FATF monitor workflow.</p>
            <ul>
              <li>Checked at: <code>{checked_at}</code></li>
              <li>Total jurisdictions: <code>{result.get("totalJurisdictions")}</code></li>
              <li>Increased monitoring: <code>{increased.get("count")}</code></li>
              <li>Call for action: <code>{call_for_action.get("count")}</code></li>
            </ul>
            <p><a href="latest.json">latest.json</a> is the stable endpoint for external apps.</p>
            <p><a href="fatf-result.json">fatf-result.json</a> and <a href="{dated_name}">{dated_name}</a> are also available.</p>
          </body>
          </html>
          """
          Path("pages/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Upload FATF result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fatf-monitor-result
          path: |
            fatf-result.json
            fatf-summary.md
            fatf-source-preflight.txt
            api.log
          if-no-files-found: ignore

      - name: Setup GitHub Pages
        if: success()
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        if: success()
        uses: actions/deploy-pages@v4
